<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BoxBox">
  <title>BoxBox</title>
  <defs>
    <linearGradient id="bbx-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6dffd2"/>
      <stop offset="1" stop-color="#0bb886"/>
    </linearGradient>
  </defs>
  <!-- tyre: outer tread ring with notches, inner sidewall ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#bbx-g)" stroke-width="7" stroke-dasharray="9.2 2.6" transform="rotate(-8 32 32)"/>
  <circle cx="32" cy="32" r="18.5" fill="#07080a" stroke="#12e3a5" stroke-opacity=".35" stroke-width="1.5"/>
  <!-- double chevron: "box, box" -->
  <path d="M21.5 22.5 L31 32 L21.5 41.5" fill="none" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32.5 22.5 L42 32 L32.5 41.5" fill="none" stroke="url(#bbx-g)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
