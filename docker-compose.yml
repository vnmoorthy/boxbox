# BoxBox over a real broker: Redpanda (Kafka API) plus one container per pipeline stage.
#
#   docker compose up --build            # broker + all four stages; open http://localhost:8088
#   docker compose up redpanda           # just the broker, for running stages locally:
#     uv run --extra kafka boxbox --broker localhost:9092 --role sim
#
# Set ANTHROPIC_API_KEY in your shell to give the strategist and engineer Claude;
# without it they use the built-in rules engine and analyst.

x-stage: &stage
  build: .
  restart: unless-stopped
  depends_on:
    redpanda:
      condition: service_healthy
  environment:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --default-log-level=warn
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  simulator:
    <<: *stage
    command: ["run", "--broker", "redpanda:29092", "--role", "sim"]

  car-state:
    <<: *stage
    command: ["run", "--broker", "redpanda:29092", "--role", "processor"]

  strategist:
    <<: *stage
    command: ["run", "--broker", "redpanda:29092", "--role", "agent"]

  dashboard:
    <<: *stage
    command: ["run", "--broker", "redpanda:29092", "--role", "dashboard", "--host", "0.0.0.0", "--no-browser"]
    ports:
      - "8088:8088"
