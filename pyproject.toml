[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boxbox"
version = "1.0.0"
description = "A real-time AI pit wall: streaming telemetry, live anomaly detection, and an AI strategist that calls every pit stop."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "vnmoorthy" }]
requires-python = ">=3.11"
keywords = ["formula-1", "streaming", "ai-agent", "anomaly-detection", "claude", "real-time", "kafka", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "anthropic>=0.70",
]

[project.optional-dependencies]
kafka = ["kafka-python>=2.0.2"]
mcp = ["mcp>=1.2"]  # 1.x (FastMCP) and 2.x (MCPServer) both supported

[project.scripts]
boxbox = "boxbox.cli:main"

[project.urls]
Homepage = "https://github.com/vnmoorthy/boxbox"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/boxbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]  # B008: FastAPI Body()/Query() defaults are idiomatic
